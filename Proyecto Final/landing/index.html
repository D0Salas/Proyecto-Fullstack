<!DOCTYPE html>
<html lang="es">
<head>

    <title>Próximamente</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay"></div>

<div class="container">

    <div class="countdown">
        <div class="time-box">

        <div class="time-box">
            <span id="horas">00</span>
            <p>Horas</p>
        </div>
        <div class="time-box">
            <span id="minutos">00</span>
            <p>Min</p>
        </div>
        <div class="time-box">
            <span id="segundos">00</span>
            <p>Seg</p>
        </div>
    </div>

    <a href="registro.html" class="btn">Únete al Buzón</a>
</div>

<script src="script.js"></script>
